name: Build YTNicoChatOverlay deb

on:
  workflow_dispatch:
  push:
    paths:
      - "YTNicoChatOverlay/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build deb on macOS
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner and Xcode info
        run: |
          sw_vers
          ls -1 /Applications | grep -E '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg xz
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          cd "$HOME/theos"
          git submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          echo "[INFO] THEOS=$HOME/theos"

      - name: Build deb package
        env:
          THEOS: /Users/runner/theos
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$THEOS/bin:$THEOS/vendor/dm.pl:$PATH"
          PACKAGER="$(command -v dpkg-deb)"
          echo "[INFO] THEOS=$THEOS"
          echo "[INFO] deb packager=$PACKAGER"
          cd YTNicoChatOverlay
          make clean \
            _THEOS_PLATFORM_DPKG_DEB="$PACKAGER" \
            _THEOS_PLATFORM_DPKG_DEB_COMPRESSION=xz \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz
          make package FINALPACKAGE=1 \
            _THEOS_PLATFORM_DPKG_DEB="$PACKAGER" \
            _THEOS_PLATFORM_DPKG_DEB_COMPRESSION=xz \
            THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz
          echo "Generated packages:"
          find packages .theos/packages -maxdepth 1 -type f -name "*.deb" -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-nico-chat-overlay-deb
          path: |
            YTNicoChatOverlay/packages/*.deb
            YTNicoChatOverlay/.theos/packages/*.deb
          if-no-files-found: error
