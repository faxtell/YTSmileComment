name: Build YTNicoChatOverlay deb

on:
  workflow_dispatch:
  push:
    paths:
      - "YTNicoChatOverlay/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build deb on macOS
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner and Xcode info
        run: |
          sw_vers
          ls -1 /Applications | grep -E '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build deb package
        run: |
          cd YTNicoChatOverlay
          chmod +x build_deb.sh
          ./build_deb.sh
          echo "Generated packages:"
          find packages .theos/packages -maxdepth 1 -type f -name "*.deb" -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-nico-chat-overlay-deb
          path: |
            YTNicoChatOverlay/packages/*.deb
            YTNicoChatOverlay/.theos/packages/*.deb
          if-no-files-found: error
