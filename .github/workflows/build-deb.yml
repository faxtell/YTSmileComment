name: Build YTNicoChatOverlay deb

on:
  workflow_dispatch:
  push:
    paths:
      - "YTNicoChatOverlay/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build deb on macOS
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner and Xcode info
        run: |
          sw_vers
          ls -1 /Applications | grep -E '^Xcode' || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg xz

      - name: Install Theos and dm.pl
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          cd "$HOME/theos"
          git submodule update --init --recursive

          mkdir -p "$HOME/theos/bin"

          # Theos normally provides dm.pl. If it is not present for any reason,
          # install the official fallback package so `make package` can create debs.
          if [[ ! -x "$HOME/theos/bin/dm.pl" ]]; then
            echo "[WARN] $HOME/theos/bin/dm.pl not found; installing fallback dm.pl via npm"
            npm install -g @theosdev/dm.pl
            DMPL_PATH="$(command -v dm.pl || true)"
            if [[ -z "$DMPL_PATH" ]]; then
              echo "[ERROR] dm.pl could not be installed"
              exit 1
            fi
            ln -sf "$DMPL_PATH" "$HOME/theos/bin/dm.pl"
            chmod +x "$HOME/theos/bin/dm.pl"
          fi

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          echo "[INFO] THEOS=$HOME/theos"
          "$HOME/theos/bin/dm.pl" --help >/dev/null

      - name: Build deb package
        run: |
          cd YTNicoChatOverlay
          chmod +x build_deb.sh
          ./build_deb.sh
          echo "Generated packages:"
          find packages .theos/packages -maxdepth 1 -type f -name "*.deb" -print -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-nico-chat-overlay-deb
          path: |
            YTNicoChatOverlay/packages/*.deb
            YTNicoChatOverlay/.theos/packages/*.deb
          if-no-files-found: error
